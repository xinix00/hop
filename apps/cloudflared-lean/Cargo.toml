[package]
name = "cloudflared-lean"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "De Cloudflare-tunnel op applib en lean: een node achter NAT publiek bereikbaar, zonder inkomende poort."
build = "build.rs"

[[bin]]
name = "cloudflared-lean"
path = "src/main.rs"
bench = false

[dependencies]
# De TcpConn-brug naar leanhttp (feature `http`): de edge en de oorsprong
# lopen allebei over een `appnet::TcpStream` in die vorm. HopOS en lean komen
# binnen via de tags van de werkruimte. leanh2 is HTTP/2 met HPACK in de
# serverrol (de edge is de client), leanhttps de naad tussen leanhttp en
# leantls (TLS 1.3 met de ketenverificatie tegen Cloudflare's eigen CA's),
# leanhttp de poot naar de lokale dienst, leanrand de spreiding van de
# herhaalpogingen.
applib = { workspace = true, features = ["http"] }
sync = { workspace = true }
leanh2 = { workspace = true }
leanhttp = { workspace = true }
leanhttps = { workspace = true }
leantls = { workspace = true }
leanrand = { workspace = true }

[lints]
workspace = true
