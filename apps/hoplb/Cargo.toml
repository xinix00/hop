# hoplb: de load balancer voor Hop op hostnaam.
#
# De kern is no_std met alloc en sans-I/O (routetabel, proxy, metrics,
# admin, de staat van de watcher); de twee vormen zijn features met elk een
# bin:
#
#   feature `std`    bin `hoplb`        de host-daemon: threads, std-sockets
#   feature `hopos`  bin `hoplb-hopos`  de bewoner op HopOS: applib, één executor
#
# De Go-boom staat in OLD/ en is de specificatie (rustdoc/PORT.md §6.5).
[package]
name = "hoplb"
version.workspace = true
edition = "2024"
rust-version = "1.93"
license-file = "LICENSE"
repository.workspace = true
description = "Load balancer op hostnaam voor Hop, met Prometheus-metrics: als host-daemon en als bewoner op HopOS."
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hoplb"
path = "src/bin/hoplb/main.rs"
required-features = ["std"]
bench = false

[[bin]]
name = "hoplb-hopos"
path = "src/bin/hoplb-hopos/main.rs"
required-features = ["hopos"]
bench = false

[features]
# `cargo build` geeft de host-daemon; de bewoner bouwt met
# `--no-default-features --features hopos` voor aarch64-unknown-none-softfloat.
default = ["std"]
std = ["dep:hostnet", "hoplib/std"]
hopos = ["dep:applib", "dep:sync", "hoplib/hopos"]

[dependencies]
# HTTP/1.1 (PORT.md §2.1): de traits waar de proxy over loopt, en de server
# van de admin-poort.
leanhttp = { workspace = true }
# De gedeelde client van Hop (../../hoplib): de kern leest er de jobs,
# taken en gebeurtenissen mee (sans-I/O), de features kiezen het transport.
hoplib = { workspace = true }
# De host-kant van het net (std-sockets als leanhttp-verbinding, block_on,
# de HTTP-client), uit Hop zelf.
hostnet = { workspace = true, optional = true }
# De app-runtime van HopOS: executor, netstack, `TcpConn`-brug voor leanhttp.
applib = { workspace = true, features = ["http"], optional = true }
sync = { workspace = true, optional = true }

[lints]
workspace = true
