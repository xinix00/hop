name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain, clippy, rustfmt and the target.
      - name: Toolchain
        run: rustup show
      - name: Gate (fmt, clippy, tests, docs, the HopOS resident)
        run: sh tools/gate.sh
