# hoplockserver: de compare-and-swap-server onder hoplock, één crate met
# drie vormen.
#
# - De bibliotheek (no_std + alloc, sans-I/O): de HTTP-afhandeling als
#   toestandsmachine, de store als trait, de sleutels en de ETags. Geen
#   socket, geen bestand, geen klok.
# - De host-bin `hoplockserver` (feature `std`, standaard aan): std-sockets,
#   een vaste pool verbindingsthreads en één store-thread met de bestanden.
# - De bewoner `hoplockserver-hopos` (feature `hopos`, target
#   aarch64-unknown-none-softfloat): applib, leanhttp over `applib::tcp`, de
#   store op het volume van de job via de fs-calls van de system-API.
[package]
name = "hoplockserver"
version = "3.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "De compare-and-swap-server onder hoplock: GET/PUT/DELETE op sleutels met If-Match en If-None-Match, één API-sleutel."
build = "build.rs"
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "hoplockserver"
path = "src/bin/hoplockserver.rs"
required-features = ["std"]

[[bin]]
name = "hoplockserver-hopos"
path = "src/bin/hoplockserver-hopos.rs"
required-features = ["hopos"]
test = false
bench = false

[[test]]
name = "http"
path = "tests/http.rs"
required-features = ["std"]

[[test]]
name = "client"
path = "tests/client.rs"
required-features = ["std"]

[features]
default = ["std"]
# De host-vorm: std-sockets en bestanden (hostnet voor de verbinding en de
# executor van één thread, zoals agentd).
std = ["dep:hostnet"]
# De bewoner op HopOS: applib (met de leanhttp-brug) en de bouwstenen van sync.
hopos = ["dep:applib", "dep:sync"]

[dependencies]
# HTTP/1.1 zonder TLS, over een Read + Write-trait: dezelfde tag als Hop en
# applib, zodat er één `AsyncRead` is.
leanhttp = { workspace = true }
# SHA-256 en de vergelijking in constante tijd, no_std en zonder deps: de
# crate van Hop's eigen verzoekauthenticatie.
auth = { workspace = true }
hostnet = { workspace = true, optional = true }
applib = { workspace = true, features = ["http"], optional = true }
sync = { workspace = true, optional = true }

[dev-dependencies]
# De Rust-client van dit protocol zoals Hop's host-daemon hem gebruikt: de
# Go-clienttests (client_test.go, object_test.go) draaien ermee tegen deze
# server, byte voor byte.
store = { workspace = true }
discovery = { workspace = true }
hostnet = { workspace = true }

[lints]
workspace = true
