# De werkruimte van hoplockserver v3: één crate aan de root met drie vormen.
#
# - De bibliotheek (no_std + alloc, sans-I/O): de HTTP-afhandeling als
#   toestandsmachine, de store als trait, de sleutels en de ETags. Geen
#   socket, geen bestand, geen klok.
# - De host-bin `hoplockserver` (feature `std`, standaard aan): std-sockets,
#   een vaste pool verbindingsthreads en één store-thread met de bestanden.
# - De bewoner `hoplockserver-hopos` (feature `hopos`, target
#   aarch64-unknown-none-softfloat): applib, leanhttp over `applib::tcp`, de
#   store op het volume van de job via de fs-calls van de system-API.
#
# Afhankelijkheden alleen via git-tags (PORT.md beslissing 6): hop en HopOS
# op v3.0.0, lean op v3.1.3. Nooit een pad over een repo-grens.
[workspace]
resolver = "3"
members = ["."]

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/xinix00/hoplockserver"

[package]
name = "hoplockserver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "De compare-and-swap-server onder hoplock: GET/PUT/DELETE op sleutels met If-Match en If-None-Match, één API-sleutel."
build = "build.rs"
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "hoplockserver"
path = "src/bin/hoplockserver.rs"
required-features = ["std"]

[[bin]]
name = "hoplockserver-hopos"
path = "src/bin/hoplockserver-hopos.rs"
required-features = ["hopos"]
test = false
bench = false

[[test]]
name = "http"
path = "tests/http.rs"
required-features = ["std"]

[[test]]
name = "client"
path = "tests/client.rs"
required-features = ["std"]

[features]
default = ["std"]
# De host-vorm: std-sockets en bestanden (hostnet voor de verbinding en de
# executor van één thread, zoals agentd).
std = ["dep:hostnet"]
# De bewoner op HopOS: applib (met de leanhttp-brug) en de bouwstenen van sync.
hopos = ["dep:applib", "dep:sync"]

[dependencies]
# HTTP/1.1 zonder TLS, over een Read + Write-trait: dezelfde tag als Hop en
# applib, zodat er één `AsyncRead` is.
leanhttp = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.3" }
# SHA-256 en de vergelijking in constante tijd, no_std en zonder deps: de
# crate van Hop's eigen verzoekauthenticatie.
auth = { git = "https://github.com/xinix00/hop.git", tag = "v3.0.0" }
hostnet = { git = "https://github.com/xinix00/hop.git", tag = "v3.0.0", optional = true }
applib = { git = "https://github.com/xinix00/HopOS.git", tag = "v3.0.0", features = ["http"], optional = true }
sync = { git = "https://github.com/xinix00/HopOS.git", tag = "v3.0.0", optional = true }

[dev-dependencies]
# De Rust-client van dit protocol zoals Hop's host-daemon hem gebruikt: de
# Go-clienttests (client_test.go, object_test.go) draaien ermee tegen deze
# server, byte voor byte.
store = { git = "https://github.com/xinix00/hop.git", tag = "v3.0.0" }
discovery = { git = "https://github.com/xinix00/hop.git", tag = "v3.0.0" }
hostnet = { git = "https://github.com/xinix00/hop.git", tag = "v3.0.0" }

[lints]
workspace = true

# De harde set uit rustdoc/README.md §12.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
non_ascii_idents = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
as_ptr_cast_mut = "warn"
as_underscore = "warn"
cast_lossless = "warn"
mut_mut = "warn"
needless_bitwise_bool = "warn"
no_mangle_with_rust_abi = "warn"
ignored_unit_patterns = "warn"
await_holding_refcell_ref = "deny"
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
large_stack_arrays = "deny"

[profile.release]
panic = "abort"
overflow-checks = true
lto = true
codegen-units = 1
debug = true
