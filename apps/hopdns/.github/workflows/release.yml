name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: tools/gate.sh

  host:
    needs: gate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build --release --features std --bin hopdns
      - run: |
          dir="hopdns-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "dist/$dir"
          cp target/release/hopdns "dist/$dir/"
          tar czf "dist/$dir.tar.gz" -C dist "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.tar.gz

  hopos:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build --release --features hopos --target aarch64-unknown-none-softfloat --bin hopdns-hopos
      - run: |
          mkdir -p dist
          objcopy="$(ls "$(rustc --print sysroot)"/lib/rustlib/*/bin/rust-objcopy 2>/dev/null | head -1)"
          src=target/aarch64-unknown-none-softfloat/release/hopdns-hopos
          if [ -n "$objcopy" ]; then "$objcopy" --strip-debug "$src" dist/hopdns-hopos-arm64.elf; else cp "$src" dist/hopdns-hopos-arm64.elf; fi
      - uses: actions/upload-artifact@v4
        with:
          name: hopos
          path: dist/*.elf

  release:
    needs: [host, hopos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && shasum -a 256 * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
