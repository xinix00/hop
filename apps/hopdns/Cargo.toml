# hopdns: DNS-service-discovery voor Hop, met federatie. De Go-generatie
# staat in OLD/ en is de specificatie (PORT.md beslissing 5).
#
# De bibliotheek is no_std met alloc en sans-I/O (de DNS-codec, de cache, de
# config, de federatie en de toestandsmachine van de watcher); de twee
# binaries kiezen hun runtime met een feature:
#
#   --features std     bin `hopdns`: de host-daemon op std-sockets
#   --features hopos   bin `hopdns-hopos`: de bewoner op applib
#                      (target aarch64-unknown-none-softfloat)
[package]
name = "hopdns"
version = "3.0.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository.workspace = true
publish = false
description = "DNS service discovery for Hop with federation: a host daemon and a HopOS resident."
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hopdns"
path = "src/bin/hopdns.rs"
required-features = ["std"]

[[bin]]
name = "hopdns-hopos"
path = "src/bin/hopdns-hopos.rs"
required-features = ["hopos"]
bench = false

[features]
default = []
# De host-kant: std-sockets en threads, de agent-API blokkerend over hostnet.
std = ["hoplib/std"]
# De bewoner: applib (executor, netstack, log), de sync-bouwstenen en de
# agent-API async op de app-executor.
hopos = ["hoplib/hopos", "dep:applib", "dep:sync"]

[dependencies]
# hoplib is de gedeelde client van de plugins: de ondertekende verzoeken, de
# antwoorden als hop's eigen typen, de SSE-lezer; zijn kern is sans-I/O en
# staat dus ook in de kern van hopdns.
hoplib = { workspace = true }
applib = { workspace = true, optional = true }
sync = { workspace = true, optional = true }

[lints]
workspace = true
