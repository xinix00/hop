name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml kiest de toolchain, de componenten en de targets.
      - run: rustup show
      - run: sh tools/gate.sh
