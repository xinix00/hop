# hopprom: de Prometheus-exporter van Hop. Eén crate, drie gezichten: de
# kern (collector en exporter) is no_std met alloc en doet geen I/O; de
# feature `std` geeft de host-bin, de feature `hopos` de bewoner op HopOS.
[package]
name = "hopprom"
version.workspace = true
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository.workspace = true
description = "Prometheus exporter for Hop clusters: a sans-I/O collector and exporter, a host binary and a HopOS resident."
build = "build.rs"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "hopprom"
path = "src/bin/hopprom.rs"
required-features = ["std"]
bench = false

[[bin]]
name = "hopprom-hopos"
path = "src/bin/hopprom-hopos.rs"
required-features = ["hopos"]
test = false
bench = false

[features]
default = []
# De host-bin: blokkerende sockets over hop's hostnet, threads als eigenaars.
std = ["dep:hostnet", "dep:leanhttp", "hoplib/std"]
# De bewoner: applib (executor, netstack) en leanhttp over applib's TcpConn.
hopos = ["dep:applib", "dep:abi", "dep:sync", "dep:leanhttp", "hoplib/hopos"]

[dependencies]
# De gedeelde client van de Hop-plugins: ondertekenen (X-Hop-Auth), de
# routes, de lezers, en het transport per runtime (`std`: hostnet, `hopos`:
# applib).
hoplib = { workspace = true }
# De woordenschat van Hop (Agent, Job, Task, Map, de tijd): dezelfde crate
# als in hoplib.
types = { workspace = true }
# De host-bin: block_on en de std-socket als leanhttp-verbinding.
hostnet = { workspace = true, optional = true }
# De bewoner: de app-runtime, het slot-adres van Hop, de leesbare tabel.
applib = { workspace = true, features = ["http"], optional = true }
abi = { workspace = true, optional = true }
sync = { workspace = true, optional = true }
# De server van /metrics en /health, op beide runtimes.
leanhttp = { workspace = true, optional = true }

[lints]
workspace = true
