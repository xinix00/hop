# hop-gui: het dashboard zelf is statisch (../index.html, app.js,
# appearance.js, style.css, vendor/) en heeft geen bouwstap; deze crate bakt
# de bestanden in en serveert ze: als host-binary (`hop-gui`, feature `std`)
# en als HopOS-app (`hop-gui-hopos`, feature `hopos`).
[package]
name = "hop-gui"
version = "3.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "De host van het Hop-dashboard: de statische bestanden ingebakken, geserveerd op een host (std) of als HopOS-app."
build = "build.rs"

[lib]
path = "src/lib.rs"

# `hop-gui -listen :3000` op Linux en macOS: std-sockets via hop's hostnet.
[[bin]]
name = "hop-gui"
path = "src/bin/host.rs"
required-features = ["std"]
bench = false

# Het dashboard als app in een slot van HopOS, geplaatst door Hop.
[[bin]]
name = "hop-gui-hopos"
path = "src/bin/hopos.rs"
required-features = ["hopos"]
bench = false

[features]
default = []
std = ["dep:hostnet"]
hopos = ["dep:applib", "dep:sync"]

[dependencies]
# HTTP/1.1 zonder TLS, dezelfde tag als Hop en HopOS.
leanhttp = { workspace = true }
# De host-kant: std-sockets als leanhttp-verbinding en een block_on.
hostnet = { workspace = true, optional = true }
# De app-runtime van HopOS met de TcpConn-brug, en de rij en de tabel van
# de werkerpool (dezelfde vorm als apps/welcome).
applib = { workspace = true, features = ["http"], optional = true }
sync = { workspace = true, optional = true }

[lints]
workspace = true
