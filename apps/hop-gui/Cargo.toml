# De werkruimte van hop-gui: het dashboard zelf is statisch (index.html,
# app.js, appearance.js, style.css, vendor/) en heeft geen bouwstap; deze
# werkruimte is alleen zijn host. De crate `hop-gui` (map server/) bakt de
# bestanden in en serveert ze: als host-binary (`hop-gui`, feature `std`)
# en als HopOS-app (`hop-gui-hopos`, feature `hopos`).
[workspace]
resolver = "3"
members = ["server"]

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/xinix00/hop-gui"

# De harde set uit rustdoc/README.md §12.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
non_ascii_idents = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
as_ptr_cast_mut = "warn"
as_underscore = "warn"
cast_lossless = "warn"
mut_mut = "warn"
needless_bitwise_bool = "warn"
no_mangle_with_rust_abi = "warn"
ignored_unit_patterns = "warn"
await_holding_refcell_ref = "deny"
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
large_stack_arrays = "deny"

[profile.release]
panic = "abort"
overflow-checks = true
lto = true
codegen-units = 1
debug = true
