[package]
name = "agentd-hopos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Hop als eerste bewoner van HopOS: agent en leader in een slot, met de bevoegde system-API."
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "agentd-hopos"
path = "src/main.rs"
test = false
bench = false

[dependencies]
types = { path = "../types" }
config = { path = "../config" }
auth = { path = "../auth" }
leader = { path = "../leader" }
agent = { path = "../agent" }
api = { path = "../api" }
runner = { path = "../runner" }
hopos-runner = { path = "../hopos-runner" }
hop-http = { path = "../hop-http" }
applib = { git = "https://github.com/xinix00/HopOS.git", tag = "v3.0.0-alpha.7" }
leanhttp = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.1" }
# HTTPS voor artifacts (GitHub releases): leanhttp over leantls, met
# ketenverificatie tegen de ingebakken Mozilla-wortels (`roots.der`).
leanhttps = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.1" }
leantls = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.1" }
# Cookies voor artifact-servers die er een zetten tussen twee redirects;
# op dezelfde tag, zodat de lean-crates één bron delen.
leancookie = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.1" }

[lints]
workspace = true

[dev-dependencies]
hopos-runner = { path = "../hopos-runner", features = ["fake"] }
abi = { git = "https://github.com/xinix00/HopOS.git", tag = "v3.0.0-alpha.7" }
