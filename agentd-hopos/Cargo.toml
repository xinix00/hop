[package]
name = "agentd-hopos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Hop als eerste bewoner van HopOS: agent en leader in een slot, met de bevoegde system-API."
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "agentd-hopos"
path = "src/main.rs"
test = false
bench = false

[dependencies]
types = { path = "../types" }
config = { path = "../config" }
auth = { path = "../auth" }
leader = { path = "../leader" }
agent = { path = "../agent" }
api = { path = "../api" }
runner = { path = "../runner" }
hopos-runner = { path = "../hopos-runner" }
hop-http = { path = "../hop-http" }
applib = { workspace = true }
# De bouwstenen van het handboek (§2): de rijen van de cluster tussen de
# eigenaar en de taken die het net op gaan (`sync::mpsc::Mailbox`). Dezelfde
# tag als applib, dat ze zelf ook gebruikt: één `sync` in het image.
sync = { workspace = true }
# De opcodes, vlaggen en de partitie-indeling van de system-API (de flip).
abi = { workspace = true }
discovery = { path = "../discovery" }
# De clusterlock op S3 (`HOPOS_S3_*`): de getekende verzoeken, over
# leans3http (de lease en de staat) of over het eigen stroomtransport van de
# object-store (`objstore::bucket`, de body op de verbinding).
leans3 = { workspace = true }
leans3http = { workspace = true }
leanhttp = { workspace = true }
# HTTPS voor artifacts (GitHub releases), de cluster en de bucket:
# `leanhttps::WebDial` met ketenverificatie tegen `leantls::MOZILLA_ROOTS`.
leanhttps = { workspace = true, features = ["mozilla-roots"] }
leantls = { workspace = true, features = ["mozilla-roots"] }

[lints]
workspace = true

[dev-dependencies]
hopos-runner = { path = "../hopos-runner", features = ["fake"] }
