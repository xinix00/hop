[package]
name = "agentd-hopos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Hop als eerste bewoner van HopOS: agent en leader in een slot, met de bevoegde system-API."
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "agentd-hopos"
path = "src/main.rs"
test = false
bench = false

[dependencies]
types = { path = "../types" }
config = { path = "../config" }
auth = { path = "../auth" }
leader = { path = "../leader" }
agent = { path = "../agent" }
api = { path = "../api" }
runner = { path = "../runner" }
hopos-runner = { path = "../hopos-runner" }
hop-http = { path = "../hop-http" }
applib = { git = "https://github.com/xinix00/HopOS.git", tag = "v3.0.1" }
# De bouwstenen van het handboek (§2): de rijen van de cluster tussen de
# eigenaar en de taken die het net op gaan (`sync::mpsc::Mailbox`). Dezelfde
# tag als applib, dat ze zelf ook gebruikt: één `sync` in het image.
sync = { git = "https://github.com/xinix00/HopOS.git", tag = "v3.0.1" }
# De opcodes, vlaggen en de partitie-indeling van de system-API (de flip).
abi = { git = "https://github.com/xinix00/HopOS.git", tag = "v3.0.1" }
discovery = { path = "../discovery" }
# De clusterlock op S3 (`HOPOS_S3_*`): de getekende verzoeken, over het
# transport van de bewoner (leanhttps met de wortels, zoals de artifacts).
leans3 = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.5" }
leanhttp = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.5" }
# HTTPS voor artifacts (GitHub releases): leanhttp over leantls, met
# ketenverificatie tegen de ingebakken Mozilla-wortels (`roots.der`).
leanhttps = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.5" }
leantls = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.5" }
# Cookies voor artifact-servers die er een zetten tussen twee redirects;
# op dezelfde tag, zodat de lean-crates één bron delen.
leancookie = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.5" }

[lints]
workspace = true

[dev-dependencies]
hopos-runner = { path = "../hopos-runner", features = ["fake"] }
