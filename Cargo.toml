# De werkruimte van Hop v3. De logica-crates zijn no_std (met alloc) zodat
# dezelfde code als HopOS-bewoner en als host-daemon draait; de binaries
# kiezen hun runtime.
[workspace]
resolver = "3"
members = [
    "types",
    "config",
    "auth",
    "leader",
    "agent",
    "api",
    "discovery",
    "runner",
    "hopos-runner",
    "hop-http",
    "agentd-hopos",
    # De host-kant (std): sockets, de opslag, de daemon en de CLI. Buiten de
    # no_std-stap van de poort (tools/gate.sh).
    "hostnet",
    "store",
    "agentd",
    "cli",
    # De client van de plugins en de apps die Hop meelevert. Ze staan op
    # Hop (types, auth, hostnet), nooit andersom: geen kern-crate hangt van
    # hoplib of van apps/ af (tools/gate.sh bewaakt dat).
    "hoplib",
    "apps/hopdns",
    "apps/hoplb",
    "apps/hopprom",
    "apps/hoplockserver",
    "apps/hop-gui/server",
    "apps/cloudflared-lean",
]

# Eén tag per buur-repo voor de hele werkruimte: lean en HopOS zijn eigen
# producten en komen binnen via een tag, nooit over een pad (PORT.md
# beslissing 6). Binnen de repo zijn het paden.
[workspace.dependencies]
leanhttp = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.12" }
leanhttps = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.12" }
leantls = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.12" }
leans3 = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.12" }
leans3http = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.12" }
leanh2 = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.12" }
leanrand = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.12" }
applib = { git = "https://github.com/xinix00/HopOS.git", tag = "v3.0.16" }
sync = { git = "https://github.com/xinix00/HopOS.git", tag = "v3.0.16" }
abi = { git = "https://github.com/xinix00/HopOS.git", tag = "v3.0.16" }
types = { path = "types" }
auth = { path = "auth" }
api = { path = "api" }
discovery = { path = "discovery" }
hostnet = { path = "hostnet" }
store = { path = "store" }
hoplib = { path = "hoplib" }

[workspace.package]
version = "3.0.13"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/xinix00/hop"

# De harde set uit rustdoc/README.md §12.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
non_ascii_idents = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
as_ptr_cast_mut = "warn"
as_underscore = "warn"
cast_lossless = "warn"
mut_mut = "warn"
needless_bitwise_bool = "warn"
no_mangle_with_rust_abi = "warn"
ignored_unit_patterns = "warn"
await_holding_refcell_ref = "deny"
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
large_stack_arrays = "deny"

[profile.release]
panic = "abort"
overflow-checks = true
lto = true
codegen-units = 1
debug = true
