# De client waarmee de Hop-plugins (hoplb, hopdns, hopprom) met een
# Hop-agent praten. Eén crate: de kern is no_std met alloc en sans-I/O; de
# features kiezen het transport (`std`: hostnet, `hopos`: applib + leanhttp).
[package]
name = "hoplib"
version = "3.0.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/xinix00/hoplib"
description = "The client for the Hop agent API: signed requests, typed replies, the SSE event stream."

[workspace]
resolver = "3"

[dependencies]
# Alleen via tags, nooit over een pad (PORT.md §6.6).
auth = { git = "https://github.com/xinix00/hop.git", tag = "v3.0.0-alpha.10" }
types = { git = "https://github.com/xinix00/hop.git", tag = "v3.0.0-alpha.10" }
hostnet = { git = "https://github.com/xinix00/hop.git", tag = "v3.0.0-alpha.10", optional = true }
applib = { git = "https://github.com/xinix00/HopOS.git", tag = "v3.0.0-alpha.10", features = ["http"], optional = true }
leanhttp = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.1", optional = true }

[features]
default = []
# De host (Linux, macOS): blokkerend over hostnet, één executor per thread.
std = ["dep:hostnet"]
# De bewoner op HopOS: async op de app-executor, over applib's TcpConn.
hopos = ["dep:applib", "dep:leanhttp"]

[dev-dependencies]
# De referentie voor de SSE-bytes: dezelfde code die de agent laat spreken.
api = { git = "https://github.com/xinix00/hop.git", tag = "v3.0.0-alpha.10" }
# De tests van de hopos-module draaien een nep-verbinding door leanhttp.
leanhttp = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.1" }

# De harde set uit rustdoc/README.md §12.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
non_ascii_idents = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
as_ptr_cast_mut = "warn"
as_underscore = "warn"
cast_lossless = "warn"
mut_mut = "warn"
needless_bitwise_bool = "warn"
no_mangle_with_rust_abi = "warn"
ignored_unit_patterns = "warn"
await_holding_refcell_ref = "deny"
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
large_stack_arrays = "deny"

[profile.release]
panic = "abort"
overflow-checks = true
lto = true
codegen-units = 1
debug = true
