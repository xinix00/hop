[package]
name = "cloudflared-lean"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "De Cloudflare-tunnel op applib en lean: een node achter NAT publiek bereikbaar, zonder inkomende poort."
build = "build.rs"

[[bin]]
name = "cloudflared-lean"
path = "src/main.rs"
bench = false

[dependencies]
# De TcpConn-brug naar leanhttp (feature `http`): de edge en de oorsprong
# lopen allebei over een `appnet::TcpStream` in die vorm.
applib = { path = "../../applib", features = ["http"] }
sync = { path = "../../sync" }
# lean op een tag en nooit over een pad (PORT.md §2.1): dezelfde tag als
# applib en Hop. leanh2 is HTTP/2 met HPACK in de serverrol (de edge is de
# client), leanhttps de naad tussen leanhttp en leantls (TLS 1.3 met de
# ketenverificatie tegen Cloudflare's eigen CA's), leanhttp de poot naar
# de lokale dienst, leanrand de spreiding van de herhaalpogingen.
leanh2 = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.11" }
leanhttp = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.11" }
leanhttps = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.11" }
leantls = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.11" }
leanrand = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.11" }

[lints]
workspace = true
