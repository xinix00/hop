# De werkruimte van hopprom v3: één crate, drie gezichten. De kern
# (collector en exporter) is no_std met alloc en doet geen I/O; de feature
# `std` geeft de host-bin, de feature `hopos` de bewoner op HopOS.
#
# Afhankelijkheden alleen via git-tags (PORT.md beslissing 6): nooit een pad
# over een repo-grens.
[workspace]
resolver = "3"
members = ["."]

[package]
name = "hopprom"
version = "3.0.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/xinix00/hopprom"
description = "Prometheus exporter for Hop clusters: a sans-I/O collector and exporter, a host binary and a HopOS resident."
build = "build.rs"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "hopprom"
path = "src/bin/hopprom.rs"
required-features = ["std"]
bench = false

[[bin]]
name = "hopprom-hopos"
path = "src/bin/hopprom-hopos.rs"
required-features = ["hopos"]
test = false
bench = false

[features]
default = []
# De host-bin: blokkerende sockets over hop's hostnet, threads als eigenaars.
std = ["dep:hostnet", "dep:leanhttp", "hoplib/std"]
# De bewoner: applib (executor, netstack) en leanhttp over applib's TcpConn.
hopos = ["dep:applib", "dep:abi", "dep:sync", "dep:leanhttp", "hoplib/hopos"]

[dependencies]
# De gedeelde client van de Hop-plugins: ondertekenen (X-Hop-Auth), de
# routes, de lezers, en het transport per runtime (`std`: hostnet, `hopos`:
# applib).
hoplib = { git = "https://github.com/xinix00/hoplib.git", tag = "v3.0.0", default-features = false }
# De woordenschat van Hop (Agent, Job, Task, Map, de tijd): dezelfde tag als
# hoplib, zodat het één crate is.
types = { git = "https://github.com/xinix00/hop.git", tag = "v3.0.0-alpha.10" }
# De host-bin: block_on en de std-socket als leanhttp-verbinding.
hostnet = { git = "https://github.com/xinix00/hop.git", tag = "v3.0.0-alpha.10", optional = true }
# De bewoner: de app-runtime, het slot-adres van Hop, de leesbare tabel.
applib = { git = "https://github.com/xinix00/HopOS.git", tag = "v3.0.0-alpha.10", features = ["http"], optional = true }
abi = { git = "https://github.com/xinix00/HopOS.git", tag = "v3.0.0-alpha.10", optional = true }
sync = { git = "https://github.com/xinix00/HopOS.git", tag = "v3.0.0-alpha.10", optional = true }
# De server van /metrics en /health, op beide runtimes.
leanhttp = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.1", optional = true }

# De harde set uit rustdoc/README.md §12.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
non_ascii_idents = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
as_ptr_cast_mut = "warn"
as_underscore = "warn"
cast_lossless = "warn"
mut_mut = "warn"
needless_bitwise_bool = "warn"
no_mangle_with_rust_abi = "warn"
ignored_unit_patterns = "warn"
await_holding_refcell_ref = "deny"
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
large_stack_arrays = "deny"

[lints]
workspace = true

[profile.release]
panic = "abort"
overflow-checks = true
lto = true
codegen-units = 1
debug = true
